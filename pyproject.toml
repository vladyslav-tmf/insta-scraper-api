[tool.poetry]
name = "insta-scraper-api"
version = "0.1.0"
description = ""
authors = ["Vladyslav Timofieiev <vladislav.tmf@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {extras = ["full"], version = "^0.115.11"}
uvicorn = "^0.34.0"
pydantic-settings = "^2.8.1"
python-dotenv = "^1.0.1"
celery = {extras = ["redis"], version = "^5.4.0"}
redis = "^5.2.1"
aiogram = "^3.18.0"
selenium = "^4.29.0"
webdriver-manager = "^4.0.2"
httpx = "^0.28.1"


[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
flake8 = "^7.1.2"
flake8-pyproject = "^1.2.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
target-version = ["py312"]

[tool.flake8]
max-line-length = 88
